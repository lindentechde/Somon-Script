name: Playground

# Builds the playground for learners (playground/, one HTML file) and
# publishes it on GitHub Pages. Pages must be turned on once in the
# repository's settings: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'playground/**'
      - 'scripts/build-browser.js'
      - 'scripts/build-playground.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the playground
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:playground

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
